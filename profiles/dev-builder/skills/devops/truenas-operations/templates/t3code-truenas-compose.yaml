services:
  t3code:
    image: node:24-bookworm
    container_name: t3code
    init: true
    restart: unless-stopped
    user: "568:568"
    working_dir: /opt/project

    environment:
      HOME: /opt/ai-tools/config/t3code/home
      T3CODE_HOME: /opt/ai-tools/config/t3code
      NPM_CONFIG_CACHE: /opt/ai-tools/cache/npm-t3
      # Upgrade manually by changing this exact version and saving the app.
      T3_VERSION: 0.1.3-nightly.YYYYMMDD.BUILD
      PATH: /opt/ai-tools/bin:/opt/ai-tools/work/npm-prefix/bin:/usr/local/bin:/usr/bin:/bin
      BASH_ENV: /opt/ai-tools/config/shared/env.sh

    command:
      - /bin/bash
      - -c
      - |
        set -eu
        export NPM_CONFIG_CACHE=/opt/ai-tools/cache/npm-t3
        export npm_config_cache="$$NPM_CONFIG_CACHE"
        mkdir -p "$$HOME" "$$NPM_CONFIG_CACHE" "$$T3CODE_HOME"

        # T3 performs background fetches through git, not gh directly.
        git config --global credential.https://github.com.helper \
          '!/opt/ai-tools/bin/gh auth git-credential'
        git config --global credential.https://gist.github.com.helper \
          '!/opt/ai-tools/bin/gh auth git-credential'

        echo "Starting t3@$$T3_VERSION"
        exec npx --yes "t3@$$T3_VERSION" serve \
          --host 0.0.0.0 \
          --no-browser \
          /opt/project

    volumes:
      - /mnt/HomeNAS/appdata/ai-tools:/opt/ai-tools
      - /mnt/HomeNAS/appdata/ai-projects:/opt/project

    # Keep private; T3 Connect uses an outbound managed tunnel.
    ports:
      - "127.0.0.1:3773:3773"

    mem_limit: 6g
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3773/.well-known/t3/environment').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
