## Production Smoke Test Checklist

| Flow | Test Steps | Expected |
|------|------------|----------|
| **Auth** | Signup → verify email → login → club select | Redirect to club context |
| **Schedule** | View sessions (own club only) | Multi-tenant isolation |
| **Booking** | Book with credits → waitlist | Credits deducted, booking confirmed |
| **Cancellation** | Cancel >2h before | Credits refunded |
| **Check-in** | Staff scans QR | Check-in recorded |
| **Payment** | Buy credit pack via Mollie | Credits added after payment |
| **Loyalty** | Complete session → points | Points added, tier checked |
| **Admin** | Owner dashboard | Own club data only |

## Rollback Procedures

| Component | Rollback Command |
|-----------|------------------|
| Vercel | `vercel rollback` or promote previous deployment |
| EAS | Re-submit previous build from Expo dashboard |
| Supabase DB | `supabase db reset --linked` (staging) / backup restore (prod) |
| Edge Functions | `supabase functions deploy <name> --project-ref <ref>` with previous version |

## Common Issues & Fixes

| Issue | Fix |
|-------|-----|
| Vercel deploy fails | Check `EXPO_PUBLIC_*` env vars in Vercel dashboard |
| EAS build fails | Run `npx expo-doctor` locally first |
| Supabase migration fails | Check `supabase migration list` for conflicts |
| Clerk webhook 401 | Verify `CLERK_WEBHOOK_SECRET` matches Clerk dashboard |
| Playwright timeout | Increase `timeout-minutes`, check base URL |
| Mollie webhook 404 | Confirm webhook URL in Mollie dashboard |

